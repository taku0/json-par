name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{matrix.version == 'snapshot'}}

    strategy:
      matrix:
        version:
          - '30.1'
          - '29.4'
          - '29.3'
          - '29.2'
          - '29.1'
          - '28.2'
          # Tests on 28.1 fails for some reason.
          # - '28.1'
          - '27.2'
          - '27.1'
          - '26.3'
          - '26.2'
          - '26.1'
          - '25.3'
          - '25.2'
          - '25.1'
          - '24.5'
          - '24.4'
          - 'snapshot'

    env:
      ELDEV_DIR: .eldev
      ELDEV: .eldev/bin/eldev

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false
    - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
      with:
        version: ${{ matrix.version }}
    - name: Install Eldev
      run: |
        mkdir -p $ELDEV_DIR/bin
        curl -fsSL https://raw.github.com/doublep/eldev/master/bin/eldev > $ELDEV_DIR/bin/eldev
        chmod a+x $ELDEV_DIR/bin/eldev
    - name: Run linters
      # Indentation rules changed since 29.
      if: ${{ startsWith(matrix.version, '29.') || startsWith(matrix.version, '30.') }}
      run: find ./*.el test/*.el '!' -name '*autoloads.el' -exec ${ELDEV} lint doc re elisp '{}' '+'
    - name: Run tests
      run: ./scripts/run_test.sh
